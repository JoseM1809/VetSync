services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
      MYSQL_DATABASE: vetsync
      MYSQL_USER: vetsync
      MYSQL_PASSWORD: ${MYSQL_CONTRASENA:-vetsync_local}
    ports:
      - "${MYSQL_PUERTO:-3306}:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
